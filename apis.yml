aid: monarch-money
name: Monarch Money
description: >-
  Monarch (formerly Monarch Money) is a subscription personal-finance app for
  budgeting, net-worth and account tracking, investment monitoring, goals,
  forecasting, and collaborative money management for couples and financial
  professionals. Backed by Accel and Forerunner Ventures, it connects to users'
  bank, credit-card, loan, and investment accounts through vetted aggregation
  partners with read-only permissions, and positions itself as a privacy-first,
  ad-free alternative to Mint and similar apps. Monarch publishes no documented
  public developer API; programmatic access exists only via an unofficial
  community Python library that reverse-engineers the app's private GraphQL
  backend. The company operates a public status page, a SafeBase Trust Center,
  and is SOC 2 Type 2 certified. This profile was surfaced as a VC portfolio
  lead and enriched from Monarch's public web surface.
